<!doctype html>
<html><head><meta charset="utf-8"><title>Hair sheet</title>
<style>html, body { margin: 0; background: #888; } canvas { display: block; }</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/","#engine/":"/styles/stick-man/engine/","#kit/":"/styles/stick-man/kit/","#motion-lib/":"/styles/stick-man/motion-lib/","#tools/":"/styles/stick-man/tools/"}}</script>
</head><body>
<script type="module">
// The hair look sheet (kit/cast/hair.js beside today's hairCap and bun), every figure in the coral sweater so the hair's detail
// sits next to the knit's. One cell a frame: row = a hair (ROWS), column = a view (COLS): the figure at a reel's beat-0 size
// (1/5 of the frame's height) from the front and from low in front, the head at close-up size (300 px of 1280) from the
// front, at 3/4, from low in front and from behind. ?run=1: the six new hairs in a row playing a look-around, frame by frame (rigid check).
//   node styles/stick-man/tools/render/shot.mjs --page styles/stick-man/tools/run/hairsheet.html --frames 0-47 --w 720 --h 1280 --out <dir>/h_%d.png
//   node styles/stick-man/tools/render/shot.mjs --page 'styles/stick-man/tools/run/hairsheet.html?run=1' --frames 0-119 --w 720 --h 1280 --mp4 <dir>/run.mp4
//   python styles/stick-man/tools/run/hairsheet_compose.py <dir> docs/hair-sheet/hair-sheet.jpg   (the sheet kept for review; docs/hair-sheet/cells is ignored)
//   a type's sheet: add --query type=mw (frames 0-95: 16 rows) and pass the type: hairsheet_compose.py <dir> docs/hair-sheet/hair-sheet-mw.jpg mw
import * as THREE from 'three';
import { makeStick, hairCap, HEAD_H, W_M } from '#engine/cast.js';
import { createStage, lin } from '#engine/look.js';
import { useFaceStyle } from '#engine/facestyles/index.js';
import { faceStateAt } from '#engine/acting.js';
import { mixFace } from '#engine/faces.js';
import { HOOKS } from '#engine/play.js';
import { compileTrack, playActor, toPose } from '#engine/motion.js';
import { getClip, placeClip } from '#motion-lib/index.js';
import { bodySpec } from '#motion-lib/bodies.js';
import '#kit/cast/wardrobe.js';
import { bun } from '#kit/cast/extras.js';
import { toonHair } from '#kit/cast/hair.js';

await useFaceStyle();
const RUN = new URLSearchParams(location.search).get('run');
// ?type=: one sheet a type of style, each on its own body (hairsheet_compose.py takes the same type); none: the first six beside today's caps
// a style the hair-in-body check shortened also shows as designed (`cut: null`, its lengths bound to the neck: `neck: true`), for the one who picks the length
const TYPES = { mw: [['pompadour', 'adult'], ['buzz', 'adult'], ['mullet', 'adult'], ['afro', 'adult'], ['bob', 'adult'], ['long', 'adult'], ['pixie', 'adult'], ['ponytail', 'adult'], ['braids', 'adult'], ['lob', 'adult'],
  ['mullet', 'adult', toonHair('mullet', null, { neck: true, cut: null })], ['long', 'adult', toonHair('long', null, { neck: true, cut: null })], ['braids', 'adult', toonHair('braids', null, { neck: true, cut: null })], ['lob', 'adult', toonHair('lob', null, { neck: true, cut: null })], ['bob', 'adult', toonHair('bob', null, { neck: true, cut: null })],
  ['long', 'adult', toonHair('long', [0.58, 0.38, 0.21], { neck: true, cut: null })]] };   // the lighter brown test (Studio 26/11)
const TYPE = new URLSearchParams(location.search).get('type');
const ROWS = (TYPES[TYPE] || [['hairCap (today)', 'adult', hairCap()], ['bun (today)', 'adult', bun()], ['side', 'adult'], ['crop', 'adult'], ['curly', 'adult'], ['elder', 'elder'], ['woman', 'adult'], ['girl', 'child']])
  .map(([n, b, f]) => ({ n, b, f: f || toonHair(n) }));
const COLS = [{ az: 0, el: 0.06 }, { az: 0, el: -0.30 }, { az: 0, el: 0.04, close: 1 }, { az: 38, el: 0.04, close: 1 }, { az: 0, el: -0.32, close: 1 }, { az: 180, el: 0.04, close: 1 }];
const W = innerWidth, H = innerHeight;
const stage = createStage({ width: W, height: H, faceInk: true, ao: 0.5, aoRadius: 0.4, shadowRadius: 2, sat: 1.0, con: 1.05, vig: 0, bloom: 0.04, hot: 0.1, ink: 2.4, shafts: 0 });
stage.scene.background = lin(0.36, 0.38, 0.41);
const back = new THREE.Mesh(new THREE.SphereGeometry(40, 48, 32), new THREE.MeshBasicMaterial({ color: lin(0.30, 0.32, 0.35), side: THREE.BackSide })); back.userData.noInk = true; stage.scene.add(back);
stage.sun.color.copy(lin(1.0, 0.97, 0.93)); stage.sun.intensity = 3.0;
stage.hemi.color.copy(lin(0.86, 0.86, 0.88)); stage.hemi.groundColor.copy(lin(0.55, 0.55, 0.56)); stage.hemi.intensity = 0.5; stage.fill.color.copy(lin(0.95, 0.95, 1.0)); stage.fill.intensity = 0.4;
const floor = new THREE.Mesh(new THREE.CircleGeometry(60, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: lin(0.30, 0.315, 0.34), roughness: 1 })); floor.receiveShadow = true; stage.scene.add(floor);
const toB = v => [v.x, -v.z, v.y];

function figure(row, x) {
  const group = new THREE.Group(); stage.scene.add(group);
  const S = makeStick(bodySpec({ name: row.n, shirt: [0.62, 0.62, 0.66], hair: [row.f] }, row.b)); group.add(S.root);
  S.rest = [{ name: 'floor', lo: [-20, -20, -0.1], hi: [20, 20, 0] }]; HOOKS.costume(S, ['sweater:coral'], { group });
  const name = (() => { for (const n of [...(RUN ? ['Adult_Idle_LookAround_Loop'] : []), 'Idle_Breath_Loop', 'Adult_Idle_Stand_Loop']) { try { getClip(n, row.b); return n; } catch { /* next */ } } })();
  const keys = placeClip({ f: 0, clip: name, body: row.b, times: 3 }, { pos: [x, 0], yaw: 90 }).keys, track = compileTrack(keys, {}, { pos: [x, 0], yaw: 90 }, 'kaiships');
  const fr = playActor(track, 0, keys[keys.length - 1].f + 2);
  return { group, S, at: f => toPose(fr[Math.min(fr.length - 1, f)], S.root.scale.x) };
}
const pose = (F, f) => { for (let k = F.done ?? 0; k <= f; k++) { F.S.pose2(F.at(k)); F.S.face({ t: k, expr: 'neutral' }); } F.done = f + 1; };
const face = (F, f, cam) => { const state = faceStateAt([{ f: -1e9, expr: 'neutral' }], 400, 7, null); F.S.face({ t: f, expr: 'neutral', state, mix: mixFace(state), blink: 0, age: 400, cam: toB(cam) }); };
const world = (S, p) => p.clone().multiplyScalar(0.6).applyMatrix4(S.root.matrixWorld);

let now = null, crowd = null;
window.__frame = i => {
  const t0 = performance.now();
  if (RUN) {
    // the six new hairs, 1.1 m apart, playing the look-around from frame 0
    if (!crowd) crowd = ROWS.slice(TYPE ? 0 : 2).map((r, k) => figure(r, (k - (crowd0 => (crowd0 - 1) / 2)(ROWS.length - (TYPE ? 0 : 2))) * 1.1));
    for (const F of crowd) pose(F, i);
    const S = crowd[0].S, dir = new THREE.Vector3(Math.sin(S.yaw + 1.2), 0.08, Math.cos(S.yaw + 1.2)).normalize(), mid = new THREE.Vector3(0, 1.75, 0);
    crowd.forEach(F => F.S.root.updateMatrixWorld(true)); const c = new THREE.Vector3(); crowd.forEach(F => c.add(world(F.S, F.S.skel.head))); c.divideScalar(crowd.length); mid.set(c.x, c.y - 0.35, c.z);
    const cam = mid.clone().addScaledVector(dir, 19); stage.setCamera(toB(cam), toB(mid), 60);
    stage.setSun(toB(dir.clone().multiplyScalar(-0.8).setY(-0.5)), toB(mid), 4); for (const F of crowd) face(F, i, cam);
  } else {
    const row = ROWS[Math.floor(i / COLS.length)], col = COLS[i % COLS.length];
    if (now) { stage.scene.remove(now.group); now.group.traverse(o => o.geometry?.dispose?.()); }
    now = figure(row, 0); pose(now, 24); const S = now.S; S.root.updateMatrixWorld(true);
    const sc = S.root.scale.x, hd = world(S, S.skel.head), az = col.az * Math.PI / 180, dir = new THREE.Vector3(Math.sin(S.yaw + az), col.el, Math.cos(S.yaw + az)).normalize();
    // beat 0: the whole figure 1/5 of the frame tall; close: the head 300 px of the frame's height
    const tall = hd.y + 0.5 * HEAD_H * W_M * sc, vis = col.close ? HEAD_H * W_M * sc * H / 300 : 5 * tall;
    const mid = col.close ? hd.clone() : new THREE.Vector3(hd.x, tall / 2, hd.z), cam = mid.clone().addScaledVector(dir, vis * 60 / 36);
    stage.setCamera(toB(cam), toB(mid), 60); stage.setSun(toB(dir.clone().multiplyScalar(-0.8).add(new THREE.Vector3(dir.z, 0, -dir.x).multiplyScalar(0.42)).setY(-0.5)), toB(mid.clone().setY(0.8)), 2.2);
    face(now, 24, cam);
  }
  const dbg = new URLSearchParams(location.search).get('dbg');   // noface / nohull: what draws the line at the hairline
  if (dbg) stage.scene.traverse(o => { if (dbg === 'noface' && o.userData.faceInk) o.visible = false; if (dbg === 'nohull' && o.parent?.userData.hairStyle && o.isMesh) o.visible = false; if (dbg === 'nomap' && o.userData.hairStyle) { o.material.map = null; o.material.color.setRGB(0.1, 0.05, 0.02); o.material.needsUpdate = true; } if (dbg === 'nohair' && o.userData.hairStyle) o.visible = false; });
  if (dbg === 'noao' && stage.ao) stage.ao.enabled = false;
  stage.scene.updateMatrixWorld(true); stage.render({ grade: { exp: 1, lift: 0, sat: 1, haze: 0, sky: false, air: false } });
  return performance.now() - t0;
};
window.__ready = true;
</script>
</body></html>
