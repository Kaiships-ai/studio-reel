<!doctype html>
<html><head><meta charset="utf-8"><title>Prop sheet</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/","#engine/":"/styles/stick-man/engine/","#kit/":"/styles/stick-man/kit/","#motion-lib/":"/styles/stick-man/motion-lib/","#tools/":"/styles/stick-man/tools/"}}</script>
</head><body>
<!-- ?place=<place>&cell=240[&view=front|back|side]: every prop of that place (kit/props/catalog.js: .glb and code-built) placed alone on a floor in
     the kit's look (engine/look.js stage, toon, ink, contact shadow), one render per cell, laid on a grid with its name.
     Driven by tools/run/propsheet.mjs: window.__sheet = the PNG data URL, window.__sheetError on a failure. -->
<script type="module">
import * as THREE from 'three';
import { createStage, B } from '#engine/look.js';
import { propKit, catalog } from '#kit/props/catalog.js';
import { tm } from '#kit/sets/dress.js';
try {
  const q = new URLSearchParams(location.search), place = q.get('place') || 'street', cell = +(q.get('cell') || 240), cols = +(q.get('cols') || 6);
  const VIEW = { front: [0, 12], back: [180, 12], side: [90, 12] }[q.get('view')];
  const rows = catalog().filter(r => r.place === place);
  if (!rows.length) throw new Error(`no props in ${place}`);
  const stage = createStage({ width: cell * 2, height: cell * 2, shafts: 0 });   // drawn at twice the size: thin rods stay whole
  stage.scene.background = new THREE.Color().setRGB(0.62, 0.74, 0.88);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), tm([0.55, 0.52, 0.47], { soft: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; stage.scene.add(floor);
  const p = propKit(stage, []); await p.load(rows.map(r => r.name));
  const lab = 34, W = cols * cell, H = Math.ceil(rows.length / cols) * (cell + lab);
  const sheet = document.createElement('canvas'); sheet.width = W; sheet.height = H; document.body.appendChild(sheet);
  const g2 = sheet.getContext('2d'); g2.imageSmoothingQuality = 'high'; g2.fillStyle = '#26262b'; g2.fillRect(0, 0, W, H);
  const v = new THREE.Vector3(), LENS = 30, T = 18 / LENS, FILL = 0.88;
  // the prop's own vertices (its contact shadow left out), Blender axes
  const cloud = o => { const pts = []; o.updateMatrixWorld(true); o.traverse(m => { if (!m.isMesh || m.userData.contact) return; const a = m.geometry.attributes.position;
    for (let k = 0; k < a.count; k++) { v.fromBufferAttribute(a, k).applyMatrix4(m.matrixWorld); pts.push([v.x, -v.z, v.y]); } }); return pts; };
  // the closest camera that looks along (az from -y toward +x, el up, degrees) and holds every point inside FILL of the cell
  function fit(pts, az, el) {
    const a = az * Math.PI / 180, e = el * Math.PI / 180, n = [Math.sin(a) * Math.cos(e), -Math.cos(a) * Math.cos(e), Math.sin(e)];
    const R = [Math.cos(a), Math.sin(a), 0], U = [-Math.sin(a) * Math.sin(e), Math.cos(a) * Math.sin(e), Math.cos(e)], dot = (p, q) => p[0] * q[0] + p[1] * q[1] + p[2] * q[2];
    const q = pts.map(p => [dot(p, R), dot(p, U), dot(p, n)]), k = T * FILL, M = f => q.reduce((m, p) => Math.max(m, f(p)), -Infinity);
    const r1 = M(p => p[0] + k * p[2]), r0 = M(p => -p[0] + k * p[2]), u1 = M(p => p[1] + k * p[2]), u0 = M(p => -p[1] + k * p[2]);
    const D = Math.max((r1 + r0) / (2 * k), (u1 + u0) / (2 * k)), cx = (r1 - r0) / 2, cy = (u1 - u0) / 2;
    const at = d => [0, 1, 2].map(j => R[j] * cx + U[j] * cy + n[j] * d);
    const ext = [0, 1].map(j => { const s = q.map(p => (p[j] - [cx, cy][j]) / (D - p[2])); return (M2(s, 1) - M2(s, -1)) / (2 * T); });
    return { pos: at(D), tgt: at(0), area: ext[0] * ext[1], D };
  }
  const M2 = (s, g) => s.reduce((m, x) => g > 0 ? Math.max(m, x) : Math.min(m, x), g > 0 ? -Infinity : Infinity);
  rows.forEach((r, i) => {
    const [w, d, h] = r.size, unit = 2 / Math.hypot(w, d, h);      // every prop is drawn 2 m corner to corner, so the air haze (from 6 m) never reaches it
    const o = p.place(r.name, [0, 0, 0], 0, { solid: false, scale: unit }), pts = cloud(o);
    // a 3/4 front view; a low wide prop is also tried from higher and a long one nearer its end (the view that fills the cell most wins); a deep one is seen from its side
    const views = VIEW ? [VIEW] : d > 1.8 * w ? [[58, 30]] : [[27, 22], ...(h < 0.4 * Math.max(w, d) ? [[27, 38]] : []), ...(w > 4 * Math.max(d, h) ? [[58, 26]] : [])];
    const cam = views.map(([az, el]) => fit(pts, az, el)).reduce((m, c) => c.area > m.area * 1.1 ? c : m);
    stage.setSun([0.45, 0.62, -0.64], [0, 0, h * unit / 2], 1.7);
    stage.setCamera(cam.pos, cam.tgt, LENS);
    stage.camera.near = 0.05; stage.camera.far = 60; stage.camera.updateProjectionMatrix();
    stage.render();
    const x = (i % cols) * cell, y = Math.floor(i / cols) * (cell + lab);
    g2.drawImage(stage.renderer.domElement, x, y, cell, cell);
    g2.fillStyle = '#f0ede6'; g2.font = '600 13px Arial, sans-serif'; g2.fillText(r.name.split('/')[1], x + 6, y + cell + 14);
    g2.fillStyle = r.source === 'code' ? '#f2b65a' : '#9cc3e6'; g2.font = '11px Arial, sans-serif';
    g2.fillText(`${r.source} · ${w.toFixed(2)}×${d.toFixed(2)}×${h.toFixed(2)} m · ${r.tris} tris`, x + 6, y + cell + 28);
    stage.scene.remove(o);
  });
  window.__sheet = sheet.toDataURL('image/png');
} catch (e) { console.error('PROPSHEET', e.message, e.stack); window.__sheetError = e.message; }
</script>
</body></html>
