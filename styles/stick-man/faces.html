<!doctype html>
<html><head><meta charset="utf-8"><title>Stick-man faces</title>
<style>
@font-face { font-family: 'InterReel'; src: url('/dev/ep01-src/fonts/Inter.ttf') format('truetype'); font-weight: 100 900; }
html, body { margin: 0; background: #ddd; }
canvas { display: block; }
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<canvas id="c"></canvas>
<script type="module">
// Proof sheet of every expression (engine/faces.js) on a flat head disc, plus the head-attached mark cards.
//   node styles/stick-man/tools/shot.mjs --page styles/stick-man/faces.html --view a --frames 12 --w 1560 --h 1300 --out faces.jpg
import { EXPR_NAMES, drawFace, MARK_NAMES } from './engine/faces.js';
await document.fonts.load('900 100px InterReel').catch(() => {});
const cv = document.getElementById('c'), g = cv.getContext('2d');
cv.width = innerWidth; cv.height = innerHeight;
const N = EXPR_NAMES.length, cols = 8, cell = Math.floor(innerWidth / cols);
window.__frame = f => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#9fb6c8'; g.fillRect(0, 0, cv.width, cv.height);
  EXPR_NAMES.forEach((e, i) => {
    const x = (i % cols) * cell + cell / 2, y = Math.floor(i / cols) * cell + cell / 2 - 8;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = '#fff'; g.strokeStyle = '#000'; g.lineWidth = cell * 0.03;
    g.beginPath(); g.ellipse(x, y, cell * 0.40, cell * 0.40 * 0.94, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    g.setTransform(cell * 0.8, 0, 0, -cell * 0.8, x, y); drawFace(g, e, 0, f);
    g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#000'; g.font = '700 18px sans-serif'; g.textAlign = 'center'; g.fillText(e, x, y + cell * 0.47);
  });
  g.setTransform(1, 0, 0, 1, 0, 0); g.font = '700 18px sans-serif'; g.fillText('marks: ' + MARK_NAMES.join(' '), cv.width / 2, cv.height - 12);
  return 0;
};
window.__ready = true;
</script>
</body></html>
