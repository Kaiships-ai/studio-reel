# The one list of tools Kaiships Studio needs. pixi.lock pins the exact builds for every platform below.
# Buyers never edit this; `/studio` installs it with `pixi run studio install`.
[workspace]
name = "kaiships-studio"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]

[dependencies]
nodejs = "22.*"
python = "3.12.*"
ffmpeg = "*"

[pypi-dependencies]
numpy = "==2.5.4"
scipy = "==1.18.1"
soundfile = "==0.14.0"
soxr = "==1.1.0"
pillow = "==13.0.0"
edge-tts = "==7.3.1"
faster-whisper = "==1.2.1"

[tasks]
studio = "node kit/studio.mjs"
make = "node styles/kai-hand-draw/tools/make.mjs"
