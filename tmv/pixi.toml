# The one list of tools How we make Ten Million Views needs. pixi.lock pins the exact builds for every platform below.
# Buyers never edit this; `/studio` installs it with `pixi run studio install`.
[workspace]
name = "tmv-studio"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]

# Oldest systems the locked builds must run on: macOS 14 (Playwright's minimum). Without this, pixi may pick Python
# wheels made only for newer macOS, and a buyer on macOS 14/15 would have to compile them (PyAV failed exactly so).
[system-requirements]
macos = "14.0"

[dependencies]
nodejs = "22.*"
python = "3.12.*"
ffmpeg = "*"

[pypi-dependencies]
numpy = "==2.5.4"
scipy = "==1.18.1"
soundfile = "==0.14.0"
soxr = "==1.1.0"
pillow = "==13.0.0"
faster-whisper = "==1.2.1"

[tasks]
studio = "node kit/studio.mjs"
designer = "node episode/designer.mjs"
fetch = "python kit/fetch.py"

# Optional extras some styles use: the offline Kokoro voice (core/tts/tts.py) and plucked strings (core/audio/pluck.py).
# Use them with `pixi run -e full …`. Kokoro needs onnxruntime, which has no Intel-Mac build, so osx-64 is left out.
[feature.full]
platforms = ["osx-arm64", "win-64", "linux-64"]

[feature.full.pypi-dependencies]
kokoro-onnx = "*"
numba = "*"

[environments]
full = { features = ["full"], solve-group = "default" }
