# The one list of tools How we make Ten Million Views needs. pixi.lock pins the exact builds for every platform below.
# Buyers never edit this; `/studio` installs it with `pixi run studio install`.
[workspace]
name = "tmv-studio"
channels = ["conda-forge"]
# The macOS entries carry the oldest system the locked builds must run on: macOS 14 (Playwright's minimum). Without it, pixi
# may pick Python wheels made only for newer macOS, and a buyer on macOS 14/15 would have to compile them (PyAV failed exactly so).
# The names are the ones pixi.lock already uses.
platforms = [
  { name = "osx-arm64-macos-14-0", platform = "osx-arm64", macos = "14.0" },
  { name = "osx-64-macos-14-0", platform = "osx-64", macos = "14.0" },
  "win-64",
  "linux-64",
]

[dependencies]
nodejs = "22.*"
python = "3.12.*"
ffmpeg = "*"

[pypi-dependencies]
numpy = "==2.5.4"
scipy = "==1.18.1"
soundfile = "==0.14.0"
soxr = "==1.1.0"
pillow = "==13.0.0"
faster-whisper = "==1.2.1"

[tasks]
studio = "node kit/studio.mjs"
designer = "node episode/designer.mjs"
fetch = "python kit/fetch.py"
