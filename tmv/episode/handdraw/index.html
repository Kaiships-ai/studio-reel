<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>episode · hand-draw</title>
<!-- The hand-draw engine (episode/engines.mjs "handdraw"): make.mjs render copies this page into the episode folder, and
     episode/handdraw/handdraw.js plays its episode.json + vo/vo.json with the kai-hand-draw presenter (core.js, kaip.js). -->
<style>
@font-face { font-family: 'Permanent Marker'; src: url(/styles/kai-hand-draw/engine/fonts/PermanentMarker-Regular.ttf) format('truetype'); font-display: block; }
@font-face { font-family: 'Shantell Sans'; src: url(/styles/kai-hand-draw/engine/fonts/ShantellSans.ttf) format('truetype'); font-weight: 300 800; font-display: block; }
html, body { margin: 0; overflow: hidden; background: #F3EBDC; }
#out { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
.p5Canvas { display: none !important; }
</style>
</head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<script src="/characters/cast.js"></script>
<script src="/node_modules/p5/lib/p5.min.js"></script>
<script src="/node_modules/p5.brush/dist/p5.brush.js"></script>
<script>
// core.js reads PROJECT and LOOPS and calls drawWorld(t) and drawCaptions(c, t); handdraw.js fills HD once the episode is loaded
// the brush canvas is painted at the render's output size (720x1280 for the review copy), never above 1080x1920
const PROJECT = { bpm: 120, duration: 1, drawScale: Math.min(1, innerWidth * devicePixelRatio / 1080) }, LOOPS = {};
const HD_LOADED = new Promise(r => { window.HD_RESOLVE = r; });
function drawWorld(t) { window.HD.world(t); }
function drawCaptions(c, t) { window.HD.overlay(c, t); }
</script>
<script src="/styles/kai-hand-draw/engine/core.js"></script>
<script src="/styles/kai-hand-draw/engine/kaip.js"></script>
<script>
// the episode's length comes from its voice, known only once handdraw.js has loaded it
const coreSetup = setup;
setup = async function () { const hd = await HD_LOADED; await coreSetup(); window.DUR = hd.DUR; };
</script>
<script type="module" src="/episode/handdraw/handdraw.js"></script>
</body>
</html>
