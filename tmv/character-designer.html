<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character designer · How we make Ten Million Views</title>
<!-- Open by double-click: no network. Start from a seeded character or from scratch, pick parts, press
     "Copy for Claude", paste into Claude Code. The preview is drawn by characters/figure.js, the same code the
     episode renders with, in the episode's neon light. -->
<style>
:root { --bg: #F4EFE6; --panel: #FFFCF6; --ink: #15120F; --muted: #6B645C; --line: #E2D9CB; --accent: #E2457A; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #15120F; --panel: #1F1B17; --ink: #F4EFE6; --muted: #A69D92; --line: #3A332C; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 32px 24px 48px; display: grid; grid-template-columns: 380px 1fr; gap: 32px; }
h1 { grid-column: 1 / -1; margin: 0; font-size: 28px; letter-spacing: -0.01em; }
.kicker { font: 600 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; display: block; margin-bottom: 8px; }
canvas { width: 380px; height: 676px; border-radius: 18px; display: block; background: #0B1230; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
.seeds { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
select, input[type=text] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
input[type=color] { width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 3px; }
.copy { margin-top: 22px; width: 100%; background: var(--accent); color: #fff; border: 0; padding: 14px; font-weight: 700; font-size: 16px; border-radius: 12px; }
pre { margin: 14px 0 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; max-height: 180px; overflow: auto; }
#status { min-height: 20px; margin-top: 8px; font-size: 13px; color: var(--muted); }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } canvas { margin: 0 auto; } }
</style>
</head>
<body>
<main>
  <h1><span class="kicker">How we make Ten Million Views</span>Character designer</h1>
  <canvas id="view" width="760" height="1352" data-testid="preview"></canvas>
  <section class="panel">
    <div class="seeds" id="seeds" data-testid="seeds"></div>
    <div class="grid" id="form"></div>
    <button class="copy" id="copy" data-testid="copy">Copy for Claude</button>
    <div id="status" role="status"></div>
    <pre id="out" data-testid="json"></pre>
  </section>
</main>
<script src="characters/cast.js"></script>
<script src="characters/figure.js"></script>
<script>
const P = window.TMV_PARTS, SEEDS = window.TMV_SEEDS, COLORS = ['skin', 'hairColor', 'topColor', 'legs'];
let c = { ...SEEDS.nova }, seed = 'nova';
const $ = id => document.getElementById(id), form = $('form');
const slug = s => (s || 'character').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'character';

for (const k of Object.keys(SEEDS)) {
  const b = document.createElement('button'); b.textContent = SEEDS[k].name; b.dataset.seed = k; b.dataset.testid = 'seed-' + k;
  b.onclick = () => { c = { ...SEEDS[k] }; seed = k; build(); }; $('seeds').append(b);
}
function field(label, el, k) { const l = document.createElement('label'); l.textContent = label; el.dataset.testid = 'field-' + k; l.append(el); form.append(l); }
function build() {
  form.textContent = '';
  const name = Object.assign(document.createElement('input'), { type: 'text', value: c.name });
  name.oninput = () => { c.name = name.value; seed = null; draw(); }; field('Name', name, 'name');
  const role = document.createElement('select');
  for (const r of ['lead', 'rival', 'mascot', 'friend', 'boss']) role.add(new Option(r, r, false, r === c.role));
  role.onchange = () => { c.role = role.value; seed = null; draw(); }; field('Role', role, 'role');
  for (const k of Object.keys(P)) {
    const s = document.createElement('select'); for (const v of P[k]) s.add(new Option(v, v, false, v === c[k]));
    s.onchange = () => { c[k] = s.value; seed = null; draw(); }; field(k[0].toUpperCase() + k.slice(1), s, k);
  }
  for (const k of COLORS) {
    const i = Object.assign(document.createElement('input'), { type: 'color', value: c[k] });
    i.oninput = () => { c[k] = i.value; seed = null; draw(); }; field({ skin: 'Skin / shell', hairColor: 'Hair', topColor: 'Top', legs: 'Legs' }[k], i, k);
  }
  draw();
}
function prompt() {
  const id = slug(c.name);
  return `Add this character to my episode's cast. In episode.json, put it in "cast" as {"id": "${id}", ...the parameters below}, `
    + `give it lines in "beats" with "who": "${id}", then re-render the episode preview.\n\n`
    + JSON.stringify({ id, ...c }, null, 2);
}
function draw() {
  for (const b of $('seeds').children) b.setAttribute('aria-pressed', String(b.dataset.seed === seed));
  const cv = $('view'), g = cv.getContext('2d'), W = cv.width, H = cv.height, k = W / 1080;
  g.setTransform(1, 0, 0, 1, 0, 0);
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0B1230'); bg.addColorStop(1, '#161C44'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  for (const [x, col] of [[0, 'rgba(255,61,139,0.35)'], [W, 'rgba(41,224,255,0.30)']]) {
    const r = g.createRadialGradient(x, H * 0.35, 0, x, H * 0.35, W * 0.9); r.addColorStop(0, col); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, W, H);
  }
  g.scale(k, k);
  const s = Math.min(1.25, 1600 / window.TMV_FIGURE_HEIGHT(c));
  window.TMV_FIGURE(g, c, { x: 540, y: 1700, s, t: performance.now() / 1000, rim: ['#FF3D8B', '#29E0FF'] });
  const txt = prompt(); if ($('out').textContent !== txt) $('out').textContent = txt;
}
$('copy').onclick = async () => {
  const text = prompt();
  let ok = true;
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); try { ok = document.execCommand('copy'); } catch { ok = false; } t.remove(); }
  $('status').textContent = ok ? `Copied ${c.name}. Paste it into Claude Code.` : 'This browser blocked copying: select the text below and copy it by hand.';
};
build();
(function loop() { draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
