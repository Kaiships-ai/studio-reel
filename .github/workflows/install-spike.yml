# Step 0 spike: does the pixi toolchain install and render a draft on every OS? Temporary; replaced by install.yml.
name: install-spike
on:
  push:
    branches: ['release/**']
    paths: ['pixi.toml', 'pixi.lock', '.github/workflows/install-spike.yml', 'core/render/**', 'kit/check-reel/**']
  workflow_dispatch:

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PIXI_NO_TELEMETRY: '1'
      LEMO_ANGLE: ${{ startsWith(matrix.os, 'macos') && 'metal' || 'swiftshader' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi (PowerShell, as a Windows buyer would)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PIXI_VERSION='v0.82.1'; irm -useb https://pixi.sh/install.ps1 | iex
          "$env:USERPROFILE\.pixi\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install pixi (sh)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.82.1 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: pixi install (timed)
        shell: bash
        run: |
          start=$(date +%s); pixi install --locked; echo "install seconds: $(( $(date +%s) - start ))"
          du -sh .pixi || true
      - name: ffmpeg has every filter and encoder we use
        shell: bash
        run: |
          pixi run ffmpeg -version | head -1
          F=$(pixi run ffmpeg -hide_banner -filters); E=$(pixi run ffmpeg -hide_banner -encoders)
          for f in loudnorm ebur128 freezedetect blackdetect; do echo "$F" | grep -qE " $f " && echo "ok $f" || { echo "MISSING $f"; exit 1; }; done
          for e in libx264 aac; do echo "$E" | grep -qE " $e " && echo "ok $e" || { echo "MISSING $e"; exit 1; }; done
      - name: python packages import (UTF-8 print; expected to fail on Windows without PYTHONUTF8)
        continue-on-error: true
        shell: bash
        run: pixi run python -c "import numpy, scipy, soundfile, soxr, PIL, edge_tts, faster_whisper; print('✓ python ok')"
      - name: npm ci + browser
        shell: bash
        run: |
          pixi run npm ci --no-audit --no-fund
          if [ "$RUNNER_OS" = Linux ]; then sudo "$(pixi run node -p process.execPath)" node_modules/playwright-core/cli.js install-deps chromium-headless-shell; fi
          pixi run node node_modules/playwright-core/cli.js install --only-shell chromium
      - name: draft render of the fixture reel (Git Bash / sh)
        shell: bash
        run: pixi run node .claude/skills/verify/draft.mjs kit/check-reel --out=out-bash
      - name: draft render again from PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: pixi run node .claude/skills/verify/draft.mjs kit/check-reel --out=out-pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-${{ matrix.os }}
          path: |
            out-*/sheet.jpg
            out-*/report.json
