# The buyer's path on every OS: build the release zip, unzip it into a clean non-git folder, install with pixi,
# make a reel. Linux on every PR and push to release branches; Windows (PowerShell and Git Bash) when the install
# path changes; macOS (Apple Silicon + Intel) on tags and by hand. See test/clean-install.mjs.
name: install
on:
  push:
    branches: ['release/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --test test/unit/*.test.mjs

  changes:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: f
        shell: bash
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base" 2>/dev/null; then echo install=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$base" HEAD | grep -qE '^(kit/|core/render/|styles/kai-hand-draw/tools/|pixi\.(toml|lock)|package(-lock)?\.json|test/clean-install\.mjs|\.github/workflows/install\.yml)' \
            && echo install=true >> "$GITHUB_OUTPUT" || echo install=false >> "$GITHUB_OUTPUT"
      - id: m
        shell: bash
        env:
          INSTALL: ${{ steps.f.outputs.install }}
          FULL: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        run: |
          m='{"os":"ubuntu-24.04","shell":"bash"}'
          if [ "$INSTALL" = true ] || [ "$FULL" = true ]; then m="$m"',{"os":"windows-2025","shell":"pwsh"},{"os":"windows-2025","shell":"bash"}'; fi
          if [ "$FULL" = true ]; then m="$m"',{"os":"macos-15","shell":"bash"},{"os":"macos-15-intel","shell":"bash"}'; fi
          echo "matrix={\"include\":[$m]}" >> "$GITHUB_OUTPUT"

  clean-install:
    needs: [unit, changes]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      PIXI_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Build the Pro zip exactly as buyers get it
        shell: bash
        run: node release/build.mjs --tier pro --out "$RUNNER_TEMP/dist"
      - name: Unzip it into a folder with a space in its name (no .git), as a buyer would
        shell: bash
        run: |
          dest="$RUNNER_TEMP/Kaiships Studio"; mkdir -p "$dest"
          zip=$(ls "$RUNNER_TEMP"/dist/kaiships-studio-pro-*.zip)
          if [ "$RUNNER_OS" = Windows ]; then pwsh -NoProfile -Command "Expand-Archive -LiteralPath '$zip' -DestinationPath '$dest'"; else unzip -q "$zip" -d "$dest"; fi
          echo "KIT=$dest/kaiships-studio" >> "$GITHUB_ENV"
      - name: Install pixi (PowerShell, as a Windows buyer would)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PIXI_VERSION='v0.82.1'; irm -useb https://pixi.sh/install.ps1 | iex
          "$env:USERPROFILE\.pixi\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install pixi (curl | bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.82.1 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rattler
            ~/AppData/Local/rattler
            ~/Library/Caches/rattler
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
            ~/Library/Caches/ms-playwright
          key: kit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock', 'package-lock.json') }}
      - name: Linux browser libraries (the one step that needs sudo)
        if: runner.os == 'Linux'
        shell: bash
        run: cd "$KIT" && pixi run studio linux-deps
      - name: Clean install and one reel
        run: node test/clean-install.mjs "${{ env.KIT }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-install-${{ matrix.os }}-${{ matrix.shell }}
          path: |
            ${{ env.KIT }}/films/ci-reel/out/check/
            ${{ env.KIT }}/films/ci-reel/*.mp4
          if-no-files-found: ignore
