# The buyer's path on every OS: build the release zip, unzip it into a clean non-git folder, install with pixi,
# make a reel (test/clean-install.mjs). Minutes are a monthly budget (macOS counts x10, Windows x2), so:
#   - a PR that changes only docs or content runs nothing;
#   - unit, lint and release checks run on every PR in checks.yml (~1 min);
#   - a PR on the paths below runs a tier's clean install on Linux only when its zip differs in more than .md and
#     LICENSE files, or this file or the test changed (release/install-needed.mjs builds both zips at base and head);
#   - a PR into a lane/** branch gets the same per-tier selection and never the five machines, label or not;
#   - all five machines (Linux, Windows pwsh + Git Bash, macOS arm64 + Intel) run only for a v* tag, by hand
#     (Actions > install > Run workflow), or when the PR gets the label `test-all-os`.
# Two zips are tested: Pro (the check reel) and tmv (How we make Ten Million Views, voiced from the shipped take, so no
# Gemini key is needed). tmv runs on Linux with Pro, and on Windows pwsh + macOS arm64 when FULL. A PR's tmv run makes
# ci-smoke, 13-17 s cut from the sample (test/tmv-smoke.mjs), drawn at 4 fps on Linux (~68 frames); the whole sample and its 11 gates run on Linux nightly on
# main (only when the tmv zip changed that day), for a v* tag, by hand, or when the PR gets the label `full-episode`.
# The smoke renders in the style whose engine the PR touches (tmv/episode/paper/ → paper, tmv/episode/handdraw/ →
# handdraw, tmv/episode/engines.mjs → every built style, else 3d), one Linux tmv leg per style; the full episode runs one
# Linux leg per style whose engine is built (release/install-needed.mjs smokeStyles, builtStyles).
# A newer push to the same PR cancels the older run.
name: install
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main, 'lane/**']
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'kit/**'
      - 'core/**'
      - 'styles/kai-hand-draw/**'
      - '.claude/skills/**'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'kit.manifest'
      - 'release/**'
      - 'test/**'
      - 'tmv/**'
      - '.github/workflows/install.yml'
      - '!**/*.md'
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'

concurrency:
  group: install-${{ github.ref }}${{ github.event_name != 'pull_request' && format('-{0}', github.event_name) || '' }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      run: ${{ steps.m.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: f
        shell: bash
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if [ "${{ github.event_name }}" = schedule ]; then base=$(git rev-list -1 --before='24 hours ago' HEAD); fi
          if [ -n "$base" ] && git cat-file -e "$base" 2>/dev/null && out=$(node release/install-needed.mjs "$base"); then echo "$out" >> "$GITHUB_OUTPUT"
          else echo "::warning::no tier decision (base '$base'): both tiers run"; printf 'pro=true\ntmv=true\nstyles=3d\n' >> "$GITHUB_OUTPUT"; fi
      - id: m
        shell: bash
        env:
          PRO: ${{ steps.f.outputs.pro }}
          TMV: ${{ steps.f.outputs.tmv }}
          STYLES: ${{ steps.f.outputs.styles }}
          FULL: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'test-all-os') && !startsWith(github.base_ref, 'lane/')) }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          full=$(node release/install-needed.mjs --full-episode); full=${full#full=}
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then PRO=false; elif [ "$full" = true ]; then TMV=true; fi
          ep=$([ "$full" = true ] && echo full || echo smoke)
          styles=$([ "$full" = true ] && node release/install-needed.mjs --built-styles || echo "styles=${STYLES:-3d}"); styles=${styles#styles=}
          m=''
          if [ "$PRO" = true ] || [ "$FULL" = true ]; then m='{"os":"ubuntu-24.04","shell":"bash","tier":"pro"}'; fi
          if [ "$TMV" = true ] || [ "$FULL" = true ]; then for st in ${styles//,/ }; do m="${m:+$m,}"'{"os":"ubuntu-24.04","shell":"bash","tier":"tmv","episode":"'$ep'","style":"'$st'"}'; done; fi
          if [ "$FULL" = true ]; then m="$m"',{"os":"windows-2025","shell":"pwsh","tier":"pro"},{"os":"windows-2025","shell":"bash","tier":"pro"},{"os":"macos-15","shell":"bash","tier":"pro"},{"os":"macos-15-intel","shell":"bash","tier":"pro"}'; fi
          if [ "$FULL" = true ]; then m="$m"',{"os":"windows-2025","shell":"pwsh","tier":"tmv"},{"os":"macos-15","shell":"bash","tier":"tmv"}'; fi
          echo "matrix={\"include\":[$m]}" >> "$GITHUB_OUTPUT"
          echo "run=$([ -n "$m" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  clean-install:
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.episode == 'full' && 90 || 45 }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    name: clean-install (${{ matrix.tier }}${{ matrix.style && format(' {0}', matrix.style) || '' }}, ${{ matrix.os }}, ${{ matrix.shell }})
    env:
      PIXI_NO_TELEMETRY: '1'
      # tmv: the voice step cuts the shipped sample take instead of calling Gemini (no key in CI)
      TMV_VO_TAKE: ${{ matrix.tier == 'tmv' && 'episodes/sample/vo/take.wav' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the ${{ matrix.tier }} zip exactly as buyers get it
        shell: bash
        run: node release/build.mjs --tier ${{ matrix.tier }} --out "$RUNNER_TEMP/dist"
      - name: The zip's checksum and file list (what the buyer gets)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/dist"
          cat SHA256SUMS
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
          zip=$(ls *.zip | head -1); unzip -Z1 "$zip" > files.txt
          echo "files: $(wc -l < files.txt) · styles: $(grep -c '^[^/]*/styles/[^/]*/STYLE.md$' files.txt)"
      - name: Unzip it into a folder with a space in its name (no .git), as a buyer would
        shell: bash
        run: |
          dest="$RUNNER_TEMP/Kaiships Studio"; mkdir -p "$dest"
          if [ "${{ matrix.tier }}" = tmv ]; then zip=$(ls "$RUNNER_TEMP"/dist/tmv-studio-*.zip); top=tmv-studio; else zip=$(ls "$RUNNER_TEMP"/dist/kaiships-studio-pro-*.zip); top=kaiships-studio; fi
          if [ "$RUNNER_OS" = Windows ]; then pwsh -NoProfile -Command "Expand-Archive -LiteralPath '$zip' -DestinationPath '$dest'"; else unzip -q "$zip" -d "$dest"; fi
          echo "KIT=$dest/$top" >> "$GITHUB_ENV"
      - name: Install pixi (PowerShell, as a Windows buyer would)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PIXI_VERSION='v0.82.1'; irm -useb https://pixi.sh/install.ps1 | iex
          "$env:USERPROFILE\.pixi\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install pixi (curl | bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.82.1 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rattler
            ~/AppData/Local/rattler
            ~/Library/Caches/rattler
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
            ~/Library/Caches/ms-playwright
          key: kit-${{ matrix.tier }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock', 'tmv/pixi.lock', 'package-lock.json') }}
      - name: Linux browser libraries (the one step that needs sudo)
        if: runner.os == 'Linux'
        shell: bash
        run: cd "$KIT" && pixi run studio linux-deps
      - name: Clean install and one reel
        run: node test/clean-install.mjs "${{ env.KIT }}" ${{ matrix.episode == 'full' && '--full-episode' || '' }} ${{ matrix.style && format('--style {0}', matrix.style) || '' }}
      - name: The episode's checks and gates, on the run page
        if: always() && matrix.tier == 'tmv'
        shell: bash
        run: |
          node -e 'const fs = require("fs"), d = process.argv[1] + "/out/";
            for (const [f, k] of [["check.json", "checks"], ["gates.json", "gates"]]) if (fs.existsSync(d + f)) {
              console.log(`\n| ${f} | | |\n|---|---|---|`);
              for (const c of JSON.parse(fs.readFileSync(d + f))[k]) console.log(`| ${c.id ? c.id + " " + c.gate : c.name} | ${c.ok ? "✓" : c.ok === null ? "–" : "✗"} | ${JSON.stringify(c.got).replace(/[|]/g, "/")} |`);
            }' "$KIT/episodes/ci-${{ matrix.episode || 'smoke' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: 'Series: ep1 from the sample, the vote picks A, ep2 opens with PREVIOUSLY'
        if: matrix.tier == 'tmv'
        shell: bash
        run: |
          cd "$KIT"; s="$RUNNER_TEMP/series"
          node episode/series.mjs new "$s" --from episodes/sample
          node episode/series.mjs next "$s" --winner A
          node episode/series.mjs status "$s"
          cat "$s/ep2/episode.json"
          node -e 'const e=require(process.argv[1]); if(e.ep!==2||!e.previously||e.previously.winner.tag!=="A"||e.beats[0].shot!=="previously") process.exit(1); console.log("✓ ep2 follows the vote of ep1: " + e.previously.winner.text)' "$s/ep2/episode.json"
          cp "$s/series.json" "$s/ep2/episode.json" "$RUNNER_TEMP/dist/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.tier == 'tmv' && format('tmv-{0}-episode-{1}-{2}-{3}', matrix.episode || 'smoke', matrix.style || '3d', matrix.os, matrix.shell) || format('clean-install-{0}-{1}-{2}', matrix.tier, matrix.os, matrix.shell) }}
          path: |
            ${{ env.KIT }}/films/ci-reel/out/check/
            ${{ env.KIT }}/films/ci-reel/*.mp4
            ${{ env.KIT }}/episodes/ci-*/*.mp4
            ${{ env.KIT }}/episodes/ci-*/out/check.json
            ${{ env.KIT }}/episodes/ci-*/out/gates.json
            ${{ env.KIT }}/episodes/ci-*/out/sheet.jpg
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zip-${{ matrix.tier }}${{ matrix.style && format('-{0}', matrix.style) || '' }}-${{ matrix.os }}-${{ matrix.shell }}
          path: |
            ${{ runner.temp }}/dist/SHA256SUMS
            ${{ runner.temp }}/dist/files.txt
            ${{ runner.temp }}/dist/series.json
            ${{ runner.temp }}/dist/episode.json
          if-no-files-found: ignore
