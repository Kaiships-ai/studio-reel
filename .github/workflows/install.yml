# The buyer's path on every OS: build the release zip, unzip it into a clean non-git folder, install with pixi,
# make a reel (test/clean-install.mjs). Minutes are a monthly budget (macOS counts x10, Windows x2), so:
#   - a PR that changes only docs or content runs nothing;
#   - a PR that changes code runs the unit + lint tests (~1 min);
#   - a PR that changes the install path (kit/, core/render/, pixi.*, package*.json, release/, the test, this file)
#     also runs the clean install on Linux (~15 min);
#   - all five machines (Linux, Windows pwsh + Git Bash, macOS arm64 + Intel) run only for a v* tag, by hand
#     (Actions > install > Run workflow), or when the PR gets the label `test-all-os`.
# A newer push to the same PR cancels the older run.
name: install
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'kit/**'
      - 'core/**'
      - 'styles/kai-hand-draw/**'
      - '.claude/skills/**'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'kit.manifest'
      - 'release/**'
      - 'test/**'
      - '.github/workflows/install.yml'
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --test test/unit/*.test.mjs

  changes:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      run: ${{ steps.m.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: f
        shell: bash
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then echo install=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$base" HEAD | grep -qE '^(kit/|core/render/|styles/kai-hand-draw/tools/|pixi\.(toml|lock)|package(-lock)?\.json|kit\.manifest|release/|test/clean-install\.mjs|\.github/workflows/install\.yml)' \
            && echo install=true >> "$GITHUB_OUTPUT" || echo install=false >> "$GITHUB_OUTPUT"
      - id: m
        shell: bash
        env:
          INSTALL: ${{ steps.f.outputs.install }}
          FULL: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'test-all-os') }}
        run: |
          m=''
          if [ "$INSTALL" = true ] || [ "$FULL" = true ]; then m='{"os":"ubuntu-24.04","shell":"bash"}'; fi
          if [ "$FULL" = true ]; then m="$m"',{"os":"windows-2025","shell":"pwsh"},{"os":"windows-2025","shell":"bash"},{"os":"macos-15","shell":"bash"},{"os":"macos-15-intel","shell":"bash"}'; fi
          echo "matrix={\"include\":[$m]}" >> "$GITHUB_OUTPUT"
          echo "run=$([ -n "$m" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  clean-install:
    needs: [unit, changes]
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      PIXI_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Build the Pro zip exactly as buyers get it
        shell: bash
        run: node release/build.mjs --tier pro --out "$RUNNER_TEMP/dist"
      - name: Unzip it into a folder with a space in its name (no .git), as a buyer would
        shell: bash
        run: |
          dest="$RUNNER_TEMP/Kaiships Studio"; mkdir -p "$dest"
          zip=$(ls "$RUNNER_TEMP"/dist/kaiships-studio-pro-*.zip)
          if [ "$RUNNER_OS" = Windows ]; then pwsh -NoProfile -Command "Expand-Archive -LiteralPath '$zip' -DestinationPath '$dest'"; else unzip -q "$zip" -d "$dest"; fi
          echo "KIT=$dest/kaiships-studio" >> "$GITHUB_ENV"
      - name: Install pixi (PowerShell, as a Windows buyer would)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PIXI_VERSION='v0.82.1'; irm -useb https://pixi.sh/install.ps1 | iex
          "$env:USERPROFILE\.pixi\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install pixi (curl | bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.82.1 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rattler
            ~/AppData/Local/rattler
            ~/Library/Caches/rattler
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
            ~/Library/Caches/ms-playwright
          key: kit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock', 'package-lock.json') }}
      - name: Linux browser libraries (the one step that needs sudo)
        if: runner.os == 'Linux'
        shell: bash
        run: cd "$KIT" && pixi run studio linux-deps
      - name: Clean install and one reel
        run: node test/clean-install.mjs "${{ env.KIT }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-install-${{ matrix.os }}-${{ matrix.shell }}
          path: |
            ${{ env.KIT }}/films/ci-reel/out/check/
            ${{ env.KIT }}/films/ci-reel/*.mp4
          if-no-files-found: ignore
