name: Bug
description: Something broke or looks wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Kit version, description: "From package.json, e.g. 1.4.1" }
    validations: { required: true }
  - type: dropdown
    id: os
    attributes: { label: OS, options: [macOS, Windows, Linux] }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: "The prompt you typed, what you expected, what you got. Paste the error." }
    validations: { required: true }
  - type: input
    id: discord
    attributes: { label: Discord thread (optional) }
