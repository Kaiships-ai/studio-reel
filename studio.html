<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Reel studio</title>
<!-- Fonts are fetched from Google Fonts at render time (not bundled). Offline, system fonts are used instead. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Shantell+Sans:wght@800&family=JetBrains+Mono:wght@700&family=Fredoka:wght@700&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; justify-items: center; }
  #out { height: min(86vh, 1920px); aspect-ratio: 9 / 16; width: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; width: min(100%, 720px); }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1080" height="1920"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="15" step="0.0333" value="0"><span id="tt">loading…</span></div>
</main>
<!-- voiceover timings (generated by `node make.mjs vo`), then the engine -->
<script src="src/vo.js"></script>
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/clawd-v3.js"></script>
<script src="src/timeline.js"></script>
<script src="src/reel.js"></script>
<script src="src/kit.js"></script>
<!-- your reel: one script per chapter file, in order -->
<script src="src/ch/c1_hook.js"></script>
<script src="src/ch/c2_checks.js"></script>
<script src="src/ch/c3_post.js"></script>
<script>
  // studio.html?t=2.5 jumps to a time · ?safe shows Instagram's UI areas, the safe zone and the caption band
  const qs = new URLSearchParams(location.search);
  if (qs.has('safe')) window.SHOW_SAFE = true;
  const q = qs.get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
